<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUFFED</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#080706; color:#b8ada0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #wrap {
    position:relative;
    width:min(100vw, calc(100vh * 1.5));
    aspect-ratio: 960 / 640;
    box-shadow: 0 0 0 1px #1d1613, 0 30px 90px -20px #000;
  }
  canvas {
    display:block; width:100%; height:100%;
    image-rendering: -webkit-optimize-contrast;
    background:#0a0807;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<script>
"use strict";
(function () {

/* ────────────────────────────────────────────────────────────────
   STUFFED — a roguelike about a very large man and very small toys
   ──────────────────────────────────────────────────────────────── */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const W = 960, H = 640;          // canvas
const HUD = 64;                  // top hud strip
const TS = 64;                   // tile size
const RW = 15, RH = 9;           // room dims in tiles (incl. wall ring)
const RPX = RW * TS, RPY = RH * TS;

const FLOORS = [
  { name:'THE NURSERY',  rooms:9,  tint:'#2a211c' },
  { name:'THE PLAYROOM', rooms:11, tint:'#25231c' },
  { name:'THE ATTIC',    rooms:12, tint:'#241c1e' },
  { name:'THE FURNACE',  rooms:13, tint:'#2c1a16' },
];

/* ── math / util ───────────────────────────────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const dist  = (ax,ay,bx,by) => Math.hypot(bx-ax, by-ay);
const rnd   = (a=1,b=0) => b + Math.random()*(a-b);
const rndi  = (a,b) => Math.floor(rnd(a,b));
const pick  = arr => arr[rndi(arr.length,0)];
const angTo = (ax,ay,bx,by) => Math.atan2(by-ay, bx-ax);
// stable pseudo-random from an integer seed — for consistent fur/stains
function hash(n){ n = (n<<13) ^ n; return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff; }

/* ── audio ─────────────────────────────────────────────────────── */
let AC = null, noiseBuf = null, muted = false;
function initAudio(){
  if (AC) return;
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  const n = AC.sampleRate * 0.5;
  noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
}
function tone(freq, dur, type='square', vol=0.12, slideTo=null){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur, vol=0.15, freq=1200, q=1){
  if (!AC || muted || !noiseBuf) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); s.stop(AC.currentTime+dur);
}
const SFX = {
  punch:  () => { tone(180,0.07,'square',0.09,60); noise(0.06,0.07,900,2); },
  hit:    () => { noise(0.09,0.13,500,1.2); tone(90,0.07,'sawtooth',0.07,40); },
  pop:    () => { noise(0.22,0.18,320,0.8); tone(70,0.18,'triangle',0.10,30); },
  hurt:   () => { tone(260,0.22,'sawtooth',0.16,70); noise(0.18,0.14,300,1); },
  stomp:  () => { tone(120,0.3,'triangle',0.2,28); noise(0.3,0.2,180,0.7); },
  door:   () => { tone(70,0.35,'sine',0.12,140); noise(0.2,0.06,240,1); },
  item:   () => { tone(440,0.09,'square',0.1); setTimeout(()=>tone(660,0.09,'square',0.1),80); setTimeout(()=>tone(880,0.16,'square',0.1),160); },
  heart:  () => { tone(520,0.07,'square',0.09); setTimeout(()=>tone(780,0.12,'square',0.09),70); },
  spit:   () => { tone(330,0.06,'sine',0.05,220); },
  boss:   () => { tone(60,1.1,'sawtooth',0.18,32); noise(0.9,0.12,140,0.6); },
  die:    () => { tone(200,1.0,'sawtooth',0.2,30); noise(0.9,0.15,200,0.5); },
  win:    () => { [0,120,240,400].forEach((t,i)=>setTimeout(()=>tone([330,440,554,660][i],0.3,'square',0.11),t)); },
};

/* ── input ─────────────────────────────────────────────────────── */
const keys = {};
let mouse = { x:W/2, y:H/2, down:false, active:false };
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true; keys[e.key] = true;
  initAudio();
  if (e.key.toLowerCase() === 'm') muted = !muted;
  if (e.key.toLowerCase() === 'p' && G.state === 'play') G.paused = !G.paused;
  if (e.key === 'Escape' && G.state === 'play') G.paused = !G.paused;
  if (G.state === 'title') startRun();
  else if ((G.state === 'dead' || G.state === 'win') && e.key.toLowerCase() === 'r') startRun();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.key] = false; });
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
});
cv.addEventListener('mousedown', () => { mouse.down = true; mouse.active = true; initAudio(); if (G.state === 'title') startRun(); });
addEventListener('mouseup',   () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ── items ─────────────────────────────────────────────────────── */
const ITEMS = [
  { id:'knuck',  name:'BRASS KNUCKLES', desc:'DAMAGE UP',  apply:p => p.damage += 1.6 },
  { id:'vial',   name:'THE VIAL',       desc:'FIRE RATE UP',apply:p => p.fireDelay = Math.max(6, p.fireDelay - 4) },
  { id:'shoes',  name:'DEAD MAN\'S BOOTS', desc:'SPEED UP', apply:p => p.speed += 0.45 },
  { id:'tub',    name:'PROTEIN TUB',    desc:'+1 HEART',    apply:p => { p.maxHp += 2; p.hp += 2; } },
  { id:'reach',  name:'LONG ARMS',      desc:'RANGE UP',    apply:p => p.range += 110 },
  { id:'split',  name:'SPLIT FIST',     desc:'DOUBLE SHOT', apply:p => p.multishot += 1 },
  { id:'lard',   name:'RENDERED LARD',  desc:'BIGGER SHOTS',apply:p => { p.bulletR += 4; p.damage += 0.6; } },
  { id:'nails',  name:'A FISTFUL OF NAILS', desc:'PIERCING',apply:p => p.pierce += 1 },
];

/* ── entities ──────────────────────────────────────────────────── */
class Player {
  constructor(){
    this.x = RPX/2; this.y = RPY/2; this.r = 17;
    this.hp = 6; this.maxHp = 6;
    this.speed = 3.15; this.damage = 3.0; this.fireDelay = 17;
    this.range = 430; this.multishot = 0; this.pierce = 0; this.bulletR = 8;
    this.cool = 0; this.inv = 0; this.face = 0; this.aim = -Math.PI/2;
    this.step = 0; this.breathe = 0; this.stompCd = 0; this.items = [];
    this.vx = 0; this.vy = 0; this.hurtFlash = 0;
  }
  hurt(n){
    if (this.inv > 0) return;
    this.hp -= n; this.inv = 70; this.hurtFlash = 22;
    G.shake = Math.max(G.shake, 12); SFX.hurt();
    for (let i=0;i<14;i++) G.parts.push(new Part(this.x, this.y, rnd(TAU), rnd(4,1), '#7d2320', rnd(30,14), rnd(4,2)));
    if (this.hp <= 0) { this.hp = 0; die(); }
  }
}

class Bullet {
  constructor(x,y,ang,spd,dmg,r,life,friendly,color){
    this.x=x; this.y=y; this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
    this.dmg=dmg; this.r=r; this.life=life; this.friendly=friendly;
    this.color=color; this.dead=false; this.spin=rnd(TAU); this.pierce = friendly?G.p.pierce:0;
    this.hitSet = new Set();
  }
}

class Part {
  constructor(x,y,ang,spd,color,life,r,grav=0){
    this.x=x; this.y=y; this.vx=Math.cos(ang)*spd; this.vy=Math.sin(ang)*spd;
    this.color=color; this.life=life; this.maxLife=life; this.r=r; this.grav=grav; this.rot=rnd(TAU);
  }
}

class Pickup {
  constructor(x,y,kind,item){ this.x=x; this.y=y; this.kind=kind; this.item=item; this.t=rnd(TAU); this.taken=false; }
}

const ETYPE = {
  ginger: { hp:6,  spd:2.45, r:15, touch:1, name:'gingerbread' },
  teddy:  { hp:22, spd:1.05, r:25, touch:1, name:'teddy'       },
  rattle: { hp:14, spd:0.0,  r:21, touch:1, name:'rattle'      },
  windup: { hp:11, spd:2.9,  r:17, touch:1, name:'wind-up'     },
};

class Enemy {
  constructor(x,y,type,floor){
    const t = ETYPE[type];
    const scale = 1 + 0.34*(floor-1);
    this.type=type; this.x=x; this.y=y; this.r=t.r;
    this.hp = Math.round(t.hp*scale); this.maxHp = this.hp;
    this.spd = t.spd; this.touch = t.touch;
    this.flash=0; this.kx=0; this.ky=0; this.t=rnd(100); this.dead=false;
    this.state='idle'; this.timer=rnd(60,20); this.dir=rnd(TAU);
    this.wob = rnd(TAU); this.seed = rndi(9999,0); this.face = 1;
    if (type==='windup'){ this.vx=Math.cos(this.dir)*this.spd; this.vy=Math.sin(this.dir)*this.spd; }
  }
  hurt(n){
    this.hp -= n; this.flash = 6; SFX.hit();
    for (let i=0;i<5;i++) G.parts.push(new Part(this.x,this.y,rnd(TAU),rnd(3.4,0.8), gibColor(this.type), rnd(26,12), rnd(3.5,1.6)));
    if (this.hp <= 0) this.kill();
  }
  kill(){
    if (this.dead) return;
    this.dead = true; SFX.pop(); G.shake = Math.max(G.shake, 5);
    const c = gibColor(this.type), c2 = gibColor2(this.type);
    for (let i=0;i<22;i++) G.parts.push(new Part(this.x,this.y,rnd(TAU),rnd(6.5,1), i%3?c:c2, rnd(46,20), rnd(6,2), 0.05));
    G.room.decals.push({ x:this.x, y:this.y, r:rnd(30,16), c:c2, a:rnd(0.5,0.25), seed:rndi(999,0) });
    if (Math.random() < 0.24) G.room.pickups.push(new Pickup(this.x, this.y, 'heart'));
    else if (Math.random() < 0.05) G.room.pickups.push(new Pickup(this.x, this.y, 'pill'));
  }
}

function gibColor(t){
  return t==='ginger' ? '#8a5a30' : t==='rattle' ? '#b8a48c' : '#ddd2ba';
}
function gibColor2(t){
  return t==='ginger' ? '#5c3418' : '#6b2b28';
}

/* ── boss ──────────────────────────────────────────────────────── */
class Boss {
  constructor(floor){
    this.x = RPX/2; this.y = RPY/2 - 40; this.r = 52;
    this.maxHp = Math.round(140 * (1 + 0.42*(floor-1)));
    this.hp = this.maxHp;
    this.flash=0; this.kx=0; this.ky=0; this.t=0; this.dead=false;
    this.phase=1; this.state='chase'; this.timer=90; this.spiral=0;
    this.chargeAng=0; this.armOff=false; this.headTorn=false;
    this.deathT = 0;
  }
  hurt(n){
    if (this.dead) return;
    this.hp -= n; this.flash = 5; SFX.hit();
    for (let i=0;i<6;i++) G.parts.push(new Part(this.x,this.y+rnd(20,-20),rnd(TAU),rnd(4,1),'#e2d7c0',rnd(30,14),rnd(4,2)));
    const f = this.hp/this.maxHp;
    if (f <= 0.66 && this.phase < 2) { this.phase = 2; this.armOff = true; this.onPhase(); }
    if (f <= 0.33 && this.phase < 3) { this.phase = 3; this.headTorn = true; this.onPhase(); }
    if (this.hp <= 0) { this.hp = 0; this.dead = true; this.deathT = 1; SFX.die(); G.shake = 30; }
  }
  onPhase(){
    SFX.boss(); G.shake = 20; this.state='chase'; this.timer=50;
    for (let i=0;i<50;i++) G.parts.push(new Part(this.x,this.y,rnd(TAU),rnd(9,2),i%2?'#e2d7c0':'#6b2b28',rnd(60,25),rnd(8,3),0.05));
  }
}

/* ── floor / room generation ───────────────────────────────────── */
class Room {
  constructor(gx,gy){
    this.gx=gx; this.gy=gy; this.type='normal';
    this.doors={u:false,d:false,l:false,r:false};
    this.cleared=false; this.spawned=false; this.visited=false;
    this.enemies=[]; this.pickups=[]; this.decals=[]; this.solid=null;
    this.boss=null; this.trapdoor=null; this.looted=false; this.rockHp={}; this.reach=null;
  }
}

function buildSolid(room){
  const g = [];
  for (let y=0;y<RH;y++){
    g[y]=[];
    for (let x=0;x<RW;x++){
      const isWall = (x===0||y===0||x===RW-1||y===RH-1);
      g[y][x] = isWall ? 1 : 0;
    }
  }
  if (room.type === 'normal') {
    for (let y=1;y<RH-1;y++) for (let x=1;x<RW-1;x++){
      if (x===7 || y===4) continue;                    // keep door corridors clear
      if (Math.abs(x-7)<=1 && Math.abs(y-4)<=1) continue;
      if (Math.random() < 0.085) g[y][x] = 2;          // heap of toys
    }
    // occasional cluster for cover
    if (Math.random() < 0.35){
      const cx = pick([3,4,10,11]), cy = pick([2,6]);
      for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){
        const x=cx+dx, y=cy+dy;
        if (x>0&&x<RW-1&&y>0&&y<RH-1 && x!==7 && y!==4 && Math.random()<0.75) g[y][x]=2;
      }
    }
  }
  room.solid = g;
  room.rockHp = {};
  for (let y=0;y<RH;y++) for (let x=0;x<RW;x++) if (g[y][x] === 2) room.rockHp[y*RW+x] = ROCK_HP;

  // flood fill from the centre — nothing may spawn in a pocket you can't walk to
  const reach = [];
  for (let y=0;y<RH;y++) reach[y] = new Array(RW).fill(false);
  const q = [[7,4]]; reach[4][7] = true;
  while (q.length){
    const [x,y] = q.pop();
    for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx = x+dx, ny = y+dy;
      if (nx<1||ny<1||nx>=RW-1||ny>=RH-1) continue;
      if (reach[ny][nx] || g[ny][nx]) continue;
      reach[ny][nx] = true; q.push([nx,ny]);
    }
  }
  room.reach = reach;
}

function genFloor(fi){
  const N = FLOORS[fi].rooms;
  const GS = 11, mid = 5;
  const grid = {};
  const key = (x,y)=>x+','+y;
  const start = new Room(mid,mid); start.type='start';
  grid[key(mid,mid)] = start;
  const list = [start];

  const dirs = [[0,-1,'u','d'],[0,1,'d','u'],[-1,0,'l','r'],[1,0,'r','l']];
  let guard = 0;
  while (list.length < N && guard++ < 4000){
    const from = pick(list);
    const d = pick(dirs);
    const nx = from.gx + d[0], ny = from.gy + d[1];
    if (nx<0||ny<0||nx>=GS||ny>=GS) continue;
    if (grid[key(nx,ny)]) continue;
    // discourage rooms with 3+ existing neighbours → keeps the map branchy
    let nb=0; for (const dd of dirs) if (grid[key(nx+dd[0], ny+dd[1])]) nb++;
    if (nb > 1 && Math.random() < 0.75) continue;
    const nr = new Room(nx,ny);
    grid[key(nx,ny)] = nr; list.push(nr);
    from.doors[d[2]] = true; nr.doors[d[3]] = true;
  }

  // dead ends = rooms with exactly one door
  const deadEnds = list.filter(r => r !== start && Object.values(r.doors).filter(Boolean).length === 1);
  const byDist = deadEnds.slice().sort((a,b) =>
    (Math.abs(b.gx-mid)+Math.abs(b.gy-mid)) - (Math.abs(a.gx-mid)+Math.abs(a.gy-mid)));

  const bossRoom = byDist[0] || list[list.length-1];
  bossRoom.type = 'boss';
  const treas = byDist.find(r => r !== bossRoom);
  if (treas) treas.type = 'treasure';

  for (const r of list) buildSolid(r);
  start.cleared = true; start.spawned = true;
  if (treas) { treas.cleared = true; treas.spawned = true; }

  return { grid, list, start, key, bossRoom };
}

function spawnRoom(room, floor){
  if (room.spawned) return;
  room.spawned = true;
  if (room.type === 'boss'){
    room.boss = new Boss(floor);
    SFX.boss();
    return;
  }
  const n = rndi(4 + floor, 2 + floor);
  const pool = floor === 1 ? ['ginger','ginger','windup','rattle','teddy']
                           : ['ginger','windup','rattle','teddy','teddy','windup'];
  let placed = 0, guard = 0;
  while (placed < n && guard++ < 300){
    const tx = rndi(RW-1,1), ty = rndi(RH-1,1);
    if (room.solid[ty][tx] || !room.reach[ty][tx]) continue;
    const x = tx*TS+TS/2, y = ty*TS+TS/2;
    if (dist(x,y,G.p.x,G.p.y) < 190) continue;
    room.enemies.push(new Enemy(x,y,pick(pool),floor));
    placed++;
  }
  if (room.enemies.length === 0) room.cleared = true;
}

/* ── game state ────────────────────────────────────────────────── */
const G = {
  state:'title', paused:false, floorIdx:0, floor:null, room:null,
  p:null, bullets:[], parts:[], shake:0, t:0, msg:null, msgT:0,
  kills:0, runT:0, fade:0, deathT:0, winT:0, titleT:0,
};

function startRun(){
  initAudio();
  G.p = new Player();
  G.floorIdx = 0; G.bullets=[]; G.parts=[]; G.kills=0; G.runT=0;
  G.shake=0; G.deathT=0; G.winT=0; G.paused=false;
  enterFloor(0);
  G.state = 'play';
}

function enterFloor(i){
  G.floorIdx = i;
  G.floor = genFloor(i);
  G.room = G.floor.start;
  G.room.visited = true;
  G.p.x = RPX/2; G.p.y = RPY/2;
  G.bullets = []; G.parts = [];
  toast(FLOORS[i].name, 150);
}

function toast(text, t=110){ G.msg = text; G.msgT = t; }

function die(){
  G.state = 'dead'; G.deathT = 0; SFX.die(); G.shake = 26;
  for (let i=0;i<40;i++) G.parts.push(new Part(G.p.x,G.p.y,rnd(TAU),rnd(7,1),i%3?'#7d2320':'#d9d6cb',rnd(70,30),rnd(6,2),0.06));
}

/* ── collision ─────────────────────────────────────────────────── */
function solidAt(room, tx, ty){
  if (tx<0||ty<0||tx>=RW||ty>=RH) return true;
  const v = room.solid[ty][tx];
  if (v === 0) return false;
  if (v === 2) return true;
  // wall — but door tiles are passable once cleared
  if (room.cleared){
    if (ty===0     && tx===7 && room.doors.u) return false;
    if (ty===RH-1  && tx===7 && room.doors.d) return false;
    if (tx===0     && ty===4 && room.doors.l) return false;
    if (tx===RW-1  && ty===4 && room.doors.r) return false;
  }
  return true;
}
function solidTileAt(room, x, y, r){
  const x0 = Math.floor((x-r)/TS), x1 = Math.floor((x+r)/TS);
  const y0 = Math.floor((y-r)/TS), y1 = Math.floor((y+r)/TS);
  for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++){
    if (!solidAt(room,tx,ty)) continue;
    const nx = clamp(x, tx*TS, tx*TS+TS), ny = clamp(y, ty*TS, ty*TS+TS);
    if ((x-nx)**2 + (y-ny)**2 < r*r) return { tx, ty };
  }
  return null;
}
function circleHitsSolid(room, x, y, r){ return solidTileAt(room, x, y, r) !== null; }

// Heaps are destructible. They have to be: an indestructible heap can wall a
// stationary enemy off from every bullet you own, and then the room never
// clears and the run is over without you dying.
const ROCK_HP = 9;
function damageRock(room, tx, ty, dmg){
  if (tx<0 || ty<0 || tx>=RW || ty>=RH) return false;
  if (room.solid[ty][tx] !== 2) return false;
  const k = ty*RW + tx;
  const cx = tx*TS + TS/2, cy = ty*TS + TS/2;
  room.rockHp[k] = (room.rockHp[k] === undefined ? ROCK_HP : room.rockHp[k]) - dmg;
  if (room.rockHp[k] <= 0){
    room.solid[ty][tx] = 0;
    for (let i=0;i<20;i++)
      G.parts.push(new Part(cx, cy, rnd(TAU), rnd(5.5,1), i%2?'#4a3a2e':'#c9bda2', rnd(44,18), rnd(6,2), 0.05));
    room.decals.push({ x:cx, y:cy, r:rnd(26,16), c:'#1c1512', a:0.4, seed:rndi(999,0) });
    SFX.pop(); G.shake = Math.max(G.shake, 4);
  } else {
    for (let i=0;i<4;i++)
      G.parts.push(new Part(cx, cy, rnd(TAU), rnd(3,0.6), '#5c483a', rnd(20,10), rnd(3.5,1.5)));
  }
  return true;
}
// Move, then push back out of anything solid we ended up inside. Resolving by
// penetration depth (rather than reverting the move) means bodies slide along
// walls and round rock corners instead of catching on them.
function resolveSolids(e){
  for (let iter=0; iter<3; iter++){
    let hit = false;
    const x0 = Math.floor((e.x-e.r)/TS), x1 = Math.floor((e.x+e.r)/TS);
    const y0 = Math.floor((e.y-e.r)/TS), y1 = Math.floor((e.y+e.r)/TS);
    for (let ty=y0; ty<=y1; ty++) for (let tx=x0; tx<=x1; tx++){
      if (!solidAt(G.room, tx, ty)) continue;
      const nx = clamp(e.x, tx*TS, tx*TS+TS), ny = clamp(e.y, ty*TS, ty*TS+TS);
      let dx = e.x-nx, dy = e.y-ny;
      const d = Math.hypot(dx, dy);
      if (d >= e.r) continue;
      hit = true;
      if (d < 0.0001){
        // centre is inside the tile — eject along the shallowest axis
        const ox = e.x - (tx*TS+TS/2), oy = e.y - (ty*TS+TS/2);
        if (Math.abs(ox) > Math.abs(oy)) e.x += Math.sign(ox||1) * (TS/2 + e.r - Math.abs(ox));
        else                             e.y += Math.sign(oy||1) * (TS/2 + e.r - Math.abs(oy));
      } else {
        const push = (e.r - d) / d;
        e.x += dx*push; e.y += dy*push;
      }
    }
    if (!hit) break;
  }
}
function moveEnt(e, dx, dy){
  e.x += dx; e.y += dy;
  resolveSolids(e);
}

/* ── room transition ───────────────────────────────────────────── */
// A doorway is one tile wide and the man is not small. Without this, walking
// at a door slightly off-centre just jams you into the wall forever.
function doorAssist(p, room, mx, my){
  if (!room.cleared) return;
  const cx = 7*TS + TS/2, cy = 4*TS + TS/2;
  const NEAR = TS*2.0, CATCH = TS*1.4, PULL = 0.22;
  const oy = p.y, ox = p.x;
  if (mx < 0 && room.doors.l && p.x < NEAR         && Math.abs(p.y-cy) < CATCH) p.y = lerp(p.y, cy, PULL);
  if (mx > 0 && room.doors.r && p.x > RPX - NEAR   && Math.abs(p.y-cy) < CATCH) p.y = lerp(p.y, cy, PULL);
  if (p.y !== oy && circleHitsSolid(room, p.x, p.y, p.r)) p.y = oy;
  if (my < 0 && room.doors.u && p.y < NEAR         && Math.abs(p.x-cx) < CATCH) p.x = lerp(p.x, cx, PULL);
  if (my > 0 && room.doors.d && p.y > RPY - NEAR   && Math.abs(p.x-cx) < CATCH) p.x = lerp(p.x, cx, PULL);
  if (p.x !== ox && circleHitsSolid(room, p.x, p.y, p.r)) p.x = ox;
}

function tryDoor(){
  const p = G.p, r = G.room;
  if (!r.cleared) return;
  let d = null;
  if (r.doors.u && p.y < TS*0.45) d='u';
  else if (r.doors.d && p.y > RPY - TS*0.45) d='d';
  else if (r.doors.l && p.x < TS*0.45) d='l';
  else if (r.doors.r && p.x > RPX - TS*0.45) d='r';
  if (!d) return;
  const off = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] }[d];
  const nr = G.floor.grid[G.floor.key(r.gx+off[0], r.gy+off[1])];
  if (!nr) return;
  G.room = nr; nr.visited = true;
  if (d==='u') { p.y = RPY - TS*1.3; p.x = RPX/2; }
  if (d==='d') { p.y = TS*1.3;       p.x = RPX/2; }
  if (d==='l') { p.x = RPX - TS*1.3; p.y = RPY/2; }
  if (d==='r') { p.x = TS*1.3;       p.y = RPY/2; }
  G.bullets = [];
  SFX.door();
  spawnRoom(nr, G.floorIdx+1);
  if (nr.type === 'boss' && !nr.cleared) toast('MR. SNUGGLES', 130);
  if (nr.type === 'treasure' && nr.pickups.length === 0 && !nr.looted){
    nr.pickups.push(new Pickup(RPX/2, RPY/2, 'item', pick(ITEMS)));
  }
}

/* ── update ────────────────────────────────────────────────────── */
function update(){
  G.t++;
  if (G.shake > 0) G.shake *= 0.86;
  if (G.msgT > 0) G.msgT--;

  if (G.state === 'title'){ G.titleT++; updateParts(); return; }
  if (G.state === 'dead'){ G.deathT++; updateParts(); return; }
  if (G.state === 'win'){ G.winT++; updateParts(); return; }
  if (G.paused) return;

  G.runT++;
  const p = G.p, room = G.room;

  /* player movement */
  let mx = 0, my = 0;
  if (keys['a']) mx -= 1;
  if (keys['d']) mx += 1;
  if (keys['w']) my -= 1;
  if (keys['s']) my += 1;
  if (mx||my){ const m = Math.hypot(mx,my); mx/=m; my/=m; p.step += 0.22; }
  else p.step *= 0.9;
  p.vx = lerp(p.vx, mx*p.speed, 0.35);
  p.vy = lerp(p.vy, my*p.speed, 0.35);
  moveEnt(p, p.vx, p.vy);
  doorAssist(p, room, mx, my);
  p.breathe += 0.05;
  if (mx||my) p.face = mx !== 0 ? Math.sign(mx) : p.face;

  /* aiming + firing */
  let ax = 0, ay = 0, firing = false;
  if (keys['ArrowLeft'])  { ax -= 1; firing = true; }
  if (keys['ArrowRight']) { ax += 1; firing = true; }
  if (keys['ArrowUp'])    { ay -= 1; firing = true; }
  if (keys['ArrowDown'])  { ay += 1; firing = true; }
  if (firing) p.aim = Math.atan2(ay, ax);
  else if (mouse.down && mouse.active){
    p.aim = angTo(p.x, p.y, mouse.x, mouse.y - HUD);
    firing = true;
  }
  if (p.cool > 0) p.cool--;
  if (firing && p.cool <= 0){
    p.cool = p.fireDelay;
    const shots = 1 + p.multishot;
    const spread = shots > 1 ? 0.17 : 0;
    for (let i=0;i<shots;i++){
      const a = p.aim + (i - (shots-1)/2) * spread;
      const b = new Bullet(p.x + Math.cos(a)*18, p.y + Math.sin(a)*18, a, 9.2,
                           p.damage, p.bulletR, Math.ceil(p.range/9.2), true, '#e8dcc6');
      G.bullets.push(b);
    }
    p.face = Math.abs(Math.cos(p.aim)) > 0.3 ? Math.sign(Math.cos(p.aim)) : p.face;
    SFX.punch();
    G.shake = Math.max(G.shake, 2);
  }

  /* stomp */
  if (p.stompCd > 0) p.stompCd--;
  if (keys[' '] && p.stompCd <= 0){
    p.stompCd = 170; SFX.stomp(); G.shake = 16;
    for (let i=0;i<26;i++) G.parts.push(new Part(p.x,p.y,i/26*TAU,rnd(7,4),'#6d5a48',rnd(26,14),rnd(5,2)));
    const R = 150;
    for (const e of room.enemies) if (!e.dead && dist(e.x,e.y,p.x,p.y) < R + e.r){
      e.hurt(p.damage*1.8);
      const a = angTo(p.x,p.y,e.x,e.y); e.kx += Math.cos(a)*13; e.ky += Math.sin(a)*13;
    }
    if (room.boss && !room.boss.dead && dist(room.boss.x,room.boss.y,p.x,p.y) < R + room.boss.r){
      room.boss.hurt(p.damage*1.8);
      const a = angTo(p.x,p.y,room.boss.x,room.boss.y);
      room.boss.kx += Math.cos(a)*5; room.boss.ky += Math.sin(a)*5;
    }
    for (const b of G.bullets) if (!b.friendly && dist(b.x,b.y,p.x,p.y) < R) b.dead = true;
    for (let ty=1; ty<RH-1; ty++) for (let tx=1; tx<RW-1; tx++)
      if (room.solid[ty][tx] === 2 && dist(tx*TS+TS/2, ty*TS+TS/2, p.x, p.y) < R)
        damageRock(room, tx, ty, p.damage*2);
  }

  if (p.inv > 0) p.inv--;
  if (p.hurtFlash > 0) p.hurtFlash--;

  /* enemies */
  for (const e of room.enemies){
    if (e.dead) continue;
    e.t++; if (e.flash > 0) e.flash--;
    updateEnemy(e, p);
    if (e.kx || e.ky){
      e.x += e.kx; e.y += e.ky;
      if (circleHitsSolid(room, e.x, e.y, e.r)){ resolveSolids(e); e.kx *= -0.4; e.ky *= -0.4; }
    }
    e.kx *= 0.85; e.ky *= 0.85;
    if (dist(e.x,e.y,p.x,p.y) < e.r + p.r - 4) p.hurt(e.touch);
  }
  room.enemies = room.enemies.filter(e => { if (e.dead) G.kills++; return !e.dead; });

  /* boss */
  if (room.boss) updateBoss(room.boss, p);

  /* clear check */
  if (!room.cleared && room.enemies.length === 0 && (!room.boss || room.boss.dead)){
    room.cleared = true; SFX.door();
    if (room.type === 'boss'){
      room.trapdoor = { x:RPX/2, y:RPY/2, t:0 };
      toast(G.floorIdx >= FLOORS.length-1 ? 'IT STOPPED MOVING' : 'THE FLOOR OPENS', 140);
      room.pickups.push(new Pickup(RPX/2 - 110, RPY/2, 'item', pick(ITEMS)));
    }
  }

  /* bullets */
  for (const b of G.bullets){
    b.x += b.vx; b.y += b.vy; b.life--; b.spin += 0.4;
    if (b.life <= 0) { b.dead = true; continue; }
    const hitTile = solidTileAt(room, b.x, b.y, b.r*0.6);
    if (hitTile){
      b.dead = true;
      if (b.friendly) damageRock(room, hitTile.tx, hitTile.ty, b.dmg);
      for (let i=0;i<5;i++) G.parts.push(new Part(b.x,b.y,rnd(TAU),rnd(2.6,0.5),b.color,rnd(16,8),rnd(3,1)));
      continue;
    }
    if (b.friendly){
      for (const e of room.enemies){
        if (e.dead || b.hitSet.has(e)) continue;
        if (dist(b.x,b.y,e.x,e.y) < b.r + e.r){
          e.hurt(b.dmg); b.hitSet.add(e);
          const a = Math.atan2(b.vy,b.vx); e.kx += Math.cos(a)*4.5; e.ky += Math.sin(a)*4.5;
          if (b.pierce > 0) b.pierce--; else { b.dead = true; break; }
        }
      }
      const bo = room.boss;
      if (!b.dead && bo && !bo.dead && !b.hitSet.has(bo) && dist(b.x,b.y,bo.x,bo.y) < b.r + bo.r*0.85){
        bo.hurt(b.dmg); b.hitSet.add(bo);
        if (b.pierce > 0) b.pierce--; else b.dead = true;
      }
    } else {
      if (dist(b.x,b.y,p.x,p.y) < b.r + p.r - 3){ p.hurt(b.dmg); b.dead = true; }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  /* pickups */
  for (const pk of room.pickups){
    if (pk.taken) continue;
    pk.t += 0.05;
    if (dist(pk.x,pk.y,p.x,p.y) < 30){
      if (pk.kind === 'heart'){
        if (p.hp < p.maxHp){ p.hp = Math.min(p.maxHp, p.hp+2); pk.taken = true; SFX.heart(); }
      } else if (pk.kind === 'pill'){
        pk.taken = true; SFX.item();
        const good = Math.random() < 0.65;
        if (good){ p.speed += 0.2; p.damage += 0.5; toast('SOMETHING GOOD'); }
        else { p.hp = Math.max(1, p.hp-1); toast('SOMETHING BAD'); }
      } else if (pk.kind === 'item'){
        pk.taken = true; SFX.item(); pk.item.apply(p); p.items.push(pk.item);
        toast(pk.item.name + '  —  ' + pk.item.desc, 150);
        G.room.looted = true;
      }
    }
  }
  room.pickups = room.pickups.filter(x => !x.taken);

  /* trapdoor */
  if (room.trapdoor){
    room.trapdoor.t++;
    if (room.trapdoor.t > 40 && dist(p.x,p.y,room.trapdoor.x,room.trapdoor.y) < 30){
      if (G.floorIdx >= FLOORS.length-1){ G.state = 'win'; G.winT = 0; SFX.win(); }
      else { SFX.door(); enterFloor(G.floorIdx+1); }
    }
  }

  tryDoor();
  updateParts();
}

function updateParts(){
  for (const q of G.parts){ q.x += q.vx; q.y += q.vy; q.vy += q.grav; q.vx *= 0.94; q.vy *= 0.94; q.life--; q.rot += 0.2; }
  G.parts = G.parts.filter(q => q.life > 0);
  if (G.parts.length > 700) G.parts.splice(0, G.parts.length - 700);
}

function updateEnemy(e, p){
  const d = dist(e.x,e.y,p.x,p.y);

  // Chasers walk straight at you and have no pathfinding, so a heap can pin one
  // in place forever. If it stops making progress, shove it somewhere random.
  if (e.type === 'ginger' || e.type === 'teddy'){
    if (e.t % 30 === 0){
      if (e.px !== undefined && dist(e.x, e.y, e.px, e.py) < 3 && e.state !== 'wind'){
        e.dodgeT = 45; e.dodgeA = rnd(TAU);
      }
      e.px = e.x; e.py = e.y;
    }
    if (e.dodgeT > 0){
      e.dodgeT--;
      moveEnt(e, Math.cos(e.dodgeA)*e.spd, Math.sin(e.dodgeA)*e.spd);
      return;
    }
  }

  switch (e.type){
    case 'ginger': {
      // sprints in bursts, pauses to twitch
      e.timer--;
      if (e.state === 'idle' && e.timer <= 0){ e.state='run'; e.timer = rndi(90,45); }
      else if (e.state === 'run' && e.timer <= 0){ e.state='idle'; e.timer = rndi(35,15); }
      if (e.state === 'run'){
        const a = angTo(e.x,e.y,p.x,p.y) + Math.sin(e.t*0.09)*0.35;
        moveEnt(e, Math.cos(a)*e.spd, Math.sin(a)*e.spd);
        e.face = Math.cos(a) < 0 ? -1 : 1;
      }
      break;
    }
    case 'teddy': {
      e.timer--;
      if (e.state === 'chase'|| e.state === 'idle'){
        const a = angTo(e.x,e.y,p.x,p.y);
        moveEnt(e, Math.cos(a)*e.spd, Math.sin(a)*e.spd);
        e.face = Math.cos(a) < 0 ? -1 : 1;
        if (e.timer <= 0 && d < 340){ e.state='wind'; e.timer=34; e.dir = a; }
      } else if (e.state === 'wind'){
        e.dir = lerp(e.dir, angTo(e.x,e.y,p.x,p.y), 0.06);
        if (e.timer <= 0){ e.state='charge'; e.timer=32; SFX.spit(); }
      } else if (e.state === 'charge'){
        const before = e.x, beforeY = e.y;
        moveEnt(e, Math.cos(e.dir)*6.2, Math.sin(e.dir)*6.2);
        if (Math.abs(e.x-before) < 0.4 && Math.abs(e.y-beforeY) < 0.4){ e.state='chase'; e.timer=rndi(120,70); }
        if (e.timer <= 0){ e.state='chase'; e.timer = rndi(140,80); }
      }
      break;
    }
    case 'rattle': {
      e.wob = Math.sin(e.t*0.07) * 0.35;
      e.timer--;
      if (e.timer <= 0){
        e.timer = rndi(140,95); e.state = 'fire';
        const base = angTo(e.x,e.y,p.x,p.y);
        const n = 6;
        for (let i=0;i<n;i++){
          const a = base + i/n*TAU;
          G.bullets.push(new Bullet(e.x, e.y, a, 3.5, 1, 8, 240, false, '#d8c9a8'));
        }
        SFX.spit();
      }
      if (e.timer > 130) e.state = 'idle';
      break;
    }
    case 'windup': {
      // ricochets around the room, homes weakly when close
      if (d < 150){
        const a = angTo(e.x,e.y,p.x,p.y);
        e.vx = lerp(e.vx, Math.cos(a)*e.spd, 0.04);
        e.vy = lerp(e.vy, Math.sin(a)*e.spd, 0.04);
      }
      const bx = e.x + e.vx, by = e.y + e.vy;
      if (circleHitsSolid(G.room, bx, e.y, e.r)) e.vx *= -1;
      if (circleHitsSolid(G.room, e.x, by, e.r)) e.vy *= -1;
      e.x += e.vx; e.y += e.vy;
      const m = Math.hypot(e.vx,e.vy) || 1;
      e.vx = e.vx/m*e.spd; e.vy = e.vy/m*e.spd;
      e.face = e.vx < 0 ? -1 : 1;
      break;
    }
  }
}

function updateBoss(b, p){
  if (b.dead){
    b.deathT++;
    if (b.deathT % 5 === 0 && b.deathT < 70){
      G.shake = Math.max(G.shake, 8);
      for (let i=0;i<14;i++) G.parts.push(new Part(b.x+rnd(50,-50), b.y+rnd(45,-45), rnd(TAU), rnd(7,1),
        i%2?'#e2d7c0':'#6b2b28', rnd(70,30), rnd(8,3), 0.05));
    }
    return;
  }
  b.t++; if (b.flash>0) b.flash--;
  b.x += b.kx; b.y += b.ky;
  b.kx *= 0.86; b.ky *= 0.86;
  b.x = clamp(b.x, TS+b.r, RPX-TS-b.r);
  b.y = clamp(b.y, TS+b.r, RPY-TS-b.r);
  b.timer--;

  const ph = b.phase;
  const spd = ph===1 ? 0.95 : ph===2 ? 1.25 : 1.6;

  if (b.state === 'chase'){
    const a = angTo(b.x,b.y,p.x,p.y);
    b.x += Math.cos(a)*spd; b.y += Math.sin(a)*spd;
    b.x = clamp(b.x, TS+b.r, RPX-TS-b.r);
    b.y = clamp(b.y, TS+b.r, RPY-TS-b.r);
    if (dist(b.x,b.y,p.x,p.y) < b.r + p.r - 8) p.hurt(1);
    if (b.timer <= 0){
      const opts = ph===1 ? ['burst','burst','chase']
                 : ph===2 ? ['burst','charge','summon']
                          : ['spiral','charge','summon','burst'];
      b.state = pick(opts); b.timer = 40;
      if (b.state === 'charge'){ b.timer = 40; b.chargeAng = angTo(b.x,b.y,p.x,p.y); }
      if (b.state === 'spiral'){ b.timer = 150; }
      if (b.state === 'chase'){ b.timer = 100; }
    }
  }
  else if (b.state === 'burst'){
    if (b.timer === 20){
      const n = ph===1 ? 10 : ph===2 ? 14 : 18;
      const base = angTo(b.x,b.y,p.x,p.y);
      for (let i=0;i<n;i++)
        G.bullets.push(new Bullet(b.x, b.y, base + i/n*TAU, 3.2, 1, 9, 300, false, '#cbb894'));
      SFX.spit(); G.shake = 6;
    }
    if (b.timer <= 0){ b.state='chase'; b.timer = ph===3?55:95; }
  }
  else if (b.state === 'charge'){
    if (b.timer > 16){
      b.chargeAng = lerp(b.chargeAng, angTo(b.x,b.y,p.x,p.y), 0.08);
    } else {
      const s = ph===3 ? 11 : 8.5;
      b.x += Math.cos(b.chargeAng)*s; b.y += Math.sin(b.chargeAng)*s;
      if (b.x < TS+b.r || b.x > RPX-TS-b.r) { b.chargeAng = Math.PI - b.chargeAng; G.shake=10; }
      if (b.y < TS+b.r || b.y > RPY-TS-b.r) { b.chargeAng = -b.chargeAng; G.shake=10; }
      b.x = clamp(b.x, TS+b.r, RPX-TS-b.r);
      b.y = clamp(b.y, TS+b.r, RPY-TS-b.r);
      if (dist(b.x,b.y,p.x,p.y) < b.r + p.r) p.hurt(2);
      if (b.t % 3 === 0) G.parts.push(new Part(b.x, b.y+40, rnd(TAU), rnd(2,0.4), '#5a4a3a', 22, rnd(5,2)));
    }
    if (b.timer <= -34){ b.state='chase'; b.timer = ph===3?50:90; }
  }
  else if (b.state === 'summon'){
    if (b.timer === 24){
      const n = ph===3 ? 3 : 2;
      for (let i=0;i<n;i++){
        const a = rnd(TAU), rr = rnd(110,70);
        const ex = clamp(b.x+Math.cos(a)*rr, TS+20, RPX-TS-20);
        const ey = clamp(b.y+Math.sin(a)*rr, TS+20, RPY-TS-20);
        G.room.enemies.push(new Enemy(ex, ey, 'ginger', G.floorIdx+1));
        for (let k=0;k<12;k++) G.parts.push(new Part(ex,ey,rnd(TAU),rnd(4,1),'#e2d7c0',rnd(28,12),rnd(4,2)));
      }
      SFX.pop();
    }
    if (b.timer <= 0){ b.state='chase'; b.timer = 110; }
  }
  else if (b.state === 'spiral'){
    b.spiral += 0.34;
    if (b.t % 7 === 0){
      for (let k=0;k<2;k++)
        G.bullets.push(new Bullet(b.x, b.y, b.spiral + k*Math.PI, 2.9, 1, 8, 300, false, '#cbb894'));
    }
    const a = angTo(b.x,b.y,p.x,p.y);
    b.x += Math.cos(a)*0.5; b.y += Math.sin(a)*0.5;
    if (dist(b.x,b.y,p.x,p.y) < b.r + p.r - 8) p.hurt(1);
    if (b.timer <= 0){ b.state='chase'; b.timer = 60; }
  }
}

/* ════════════════════════════════════════════════════════════════
   RENDERING
   ════════════════════════════════════════════════════════════════ */

function draw(){
  ctx.fillStyle = '#080706';
  ctx.fillRect(0,0,W,H);

  if (G.state === 'title'){ drawTitle(); return; }

  ctx.save();
  const sh = G.shake;
  ctx.translate(rnd(sh,-sh), HUD + rnd(sh,-sh));

  drawRoom(G.room);
  drawDecals(G.room);
  drawTrapdoor(G.room);
  drawPickups(G.room);

  // depth sort so tall things overlap correctly
  const drawables = [];
  for (const e of G.room.enemies) drawables.push({ y:e.y, f:() => drawEnemy(e) });
  if (G.room.boss && (!G.room.boss.dead || G.room.boss.deathT < 60))
    drawables.push({ y:G.room.boss.y, f:() => drawBoss(G.room.boss) });
  if (G.state !== 'dead') drawables.push({ y:G.p.y, f:() => drawPlayer(G.p) });
  drawables.sort((a,b) => a.y - b.y);
  for (const d of drawables) d.f();

  drawParts();
  drawBullets();
  drawWallsTop(G.room);
  drawVignette();
  ctx.restore();

  drawHUD();
  drawOverlays();
}

/* ── room floor / walls ────────────────────────────────────────── */
function drawRoom(room){
  const tint = FLOORS[G.floorIdx].tint;
  // floor
  for (let y=1;y<RH-1;y++) for (let x=1;x<RW-1;x++){
    const h = hash(x*73 + y*131 + G.floorIdx*997);
    ctx.fillStyle = (x+y)%2 ? '#211b18' : '#251e1a';
    ctx.fillRect(x*TS, y*TS, TS, TS);
    // grime — sparse and soft, so it doesn't read as a grid of identical squares
    if (h > 0.55){
      const h2 = hash(x*17 + y*911 + G.floorIdx*31), h3 = hash(x*311 + y*29);
      ctx.globalAlpha = 0.10 + h2*0.14;
      ctx.fillStyle = '#0a0706';
      ctx.beginPath();
      ctx.ellipse(x*TS + 12 + h2*40, y*TS + 12 + h3*40,
                  7 + h*16, 5 + h3*13, h2*3, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // seam lines
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
    ctx.strokeRect(x*TS+0.5, y*TS+0.5, TS-1, TS-1);
  }
  // tint wash
  ctx.globalAlpha = 0.18; ctx.fillStyle = tint;
  ctx.fillRect(TS, TS, RPX-TS*2, RPY-TS*2); ctx.globalAlpha = 1;

  // rocks
  for (let y=1;y<RH-1;y++) for (let x=1;x<RW-1;x++){
    if (room.solid[y][x] !== 2) continue;
    const hp = room.rockHp[y*RW+x];
    drawRock(x*TS, y*TS, x*31+y*57+G.floorIdx*13, hp === undefined ? 1 : clamp(hp/ROCK_HP, 0, 1));
  }
}

function drawRock(px, py, seed, f){
  const h = hash(seed);
  ctx.save(); ctx.translate(px+TS/2, py+TS/2);
  ctx.scale(0.72 + f*0.28, 0.72 + f*0.28);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(3, 16, 26, 9, 0, 0, TAU); ctx.fill();

  // A heap of dead toys. Built from a few recognisable silhouettes so the room
  // reads as a place where toys are dumped, not a cave with boulders in it.
  const tone  = ['#3d3128','#453529','#392c25'][seed % 3];
  const tone2 = ['#4f3f32','#57452f','#4a3a30'][(seed>>2) % 3];

  ctx.fillStyle = tone;
  ctx.beginPath();
  for (let i=0;i<9;i++){
    const a = i/9*TAU, rr = 19 + hash(seed+i*7)*12;
    const x = Math.cos(a)*rr, y = Math.sin(a)*rr*0.74 - 2;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.fill();

  const variant = seed % 4;
  if (variant === 0){
    // doll head, face down in the pile
    ctx.fillStyle = tone2;
    ctx.beginPath(); ctx.arc(-5+h*8, -11, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#17100c';
    ctx.beginPath(); ctx.arc(-9+h*8, -13, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-1+h*8, -13, 2.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#17100c'; ctx.lineWidth = 1.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-5+h*8, -7, 4, 0.2, Math.PI-0.2); ctx.stroke();
  } else if (variant === 1){
    // a pair of ears over the rim
    ctx.fillStyle = tone2;
    ctx.beginPath(); ctx.arc(-11, -13, 7.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(4+h*6, -16, 7.5, 0, TAU); ctx.fill();
    ctx.fillStyle = tone;
    ctx.beginPath(); ctx.arc(-11, -13, 3.4, 0, TAU); ctx.fill();
  } else if (variant === 2){
    // stacked alphabet blocks
    ctx.fillStyle = tone2;
    ctx.fillRect(-14, -16, 15, 15);
    ctx.fillRect(2, -12, 12, 12);
    ctx.strokeStyle = 'rgba(20,14,10,0.55)'; ctx.lineWidth = 1.2;
    ctx.strokeRect(-14, -16, 15, 15); ctx.strokeRect(2, -12, 12, 12);
    ctx.fillStyle = 'rgba(20,14,10,0.5)';
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('ABCMY'[seed % 5], -6.5, -5);
  } else {
    // ribcage of a broken hobby horse / spring toy
    ctx.strokeStyle = tone2; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    for (let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(-2+h*6, -6, 6+i*3.5, Math.PI*1.15, Math.PI*1.85);
      ctx.stroke();
    }
  }

  // a limb sticking out of the pile
  ctx.strokeStyle = tone2; ctx.lineWidth = 5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(8+h*8, -4); ctx.lineTo(16+h*10, -18-h*8); ctx.stroke();
  ctx.fillStyle = tone2;
  ctx.beginPath(); ctx.arc(16+h*10, -19-h*8, 3.4, 0, TAU); ctx.fill();
  if (f < 1){ // stuffing coming out of the heap as it breaks apart
    ctx.fillStyle = '#c9bda2';
    for (let i=0;i<4;i++){
      if (hash(seed+i*53) > f){
        ctx.beginPath();
        ctx.arc(-14+hash(seed+i*3)*28, -12+hash(seed+i*29)*20, 2.5+hash(seed+i*11)*2.5, 0, TAU);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawWallsTop(room){
  const wallDark = '#100c0b', wallFace = '#1a1412', wallEdge = '#241b18';
  // top wall
  ctx.fillStyle = wallDark; ctx.fillRect(0, 0, RPX, TS);
  ctx.fillStyle = wallFace; ctx.fillRect(0, TS-16, RPX, 16);
  // bottom, left, right
  ctx.fillStyle = wallDark;
  ctx.fillRect(0, RPY-TS, RPX, TS);
  ctx.fillRect(0, 0, TS, RPY);
  ctx.fillRect(RPX-TS, 0, TS, RPY);
  ctx.fillStyle = wallFace;
  ctx.fillRect(TS-14, 0, 14, RPY);
  ctx.fillRect(RPX-TS, 0, 14, RPY);
  ctx.fillRect(0, RPY-TS, RPX, 12);

  // wallpaper texture on the inner faces
  ctx.fillStyle = 'rgba(120,90,60,0.05)';
  for (let x=0;x<RPX;x+=18) ctx.fillRect(x, TS-16, 8, 16);

  ctx.strokeStyle = wallEdge; ctx.lineWidth = 2;
  ctx.strokeRect(TS-1, TS-1, RPX-TS*2+2, RPY-TS*2+2);

  // doors
  drawDoor(room,'u'); drawDoor(room,'d'); drawDoor(room,'l'); drawDoor(room,'r');
}

function drawDoor(room, d){
  if (!room.doors[d]) return;
  const open = room.cleared;
  let x,y,w,h;
  if (d==='u'){ x=7*TS; y=0;        w=TS; h=TS; }
  if (d==='d'){ x=7*TS; y=RPY-TS;   w=TS; h=TS; }
  if (d==='l'){ x=0;    y=4*TS;     w=TS; h=TS; }
  if (d==='r'){ x=RPX-TS; y=4*TS;   w=TS; h=TS; }

  const nb = nextIsBoss(room, d);
  ctx.save(); ctx.translate(x,y);
  // frame
  ctx.fillStyle = '#0c0908'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = nb ? '#5a2a26' : '#2e241f'; ctx.lineWidth = 4;
  ctx.strokeRect(3,3,w-6,h-6);
  if (open){
    // dark opening with a faint glow beyond
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0a0807'); g.addColorStop(0.5,'#1d1512'); g.addColorStop(1,'#0a0807');
    ctx.fillStyle = g; ctx.fillRect(8,8,w-16,h-16);
    ctx.fillStyle = 'rgba(200,150,90,0.06)';
    ctx.fillRect(10,10,w-20,h-20);
  } else {
    // barred shut
    ctx.fillStyle = '#241a16'; ctx.fillRect(8,8,w-16,h-16);
    ctx.fillStyle = '#3a2a22';
    for (let i=0;i<3;i++) ctx.fillRect(10, 14+i*15, w-20, 7);
    ctx.fillStyle = '#120d0b';
    for (let i=0;i<3;i++) ctx.fillRect(10, 21+i*15, w-20, 2);
  }
  if (nb && !open){
    ctx.fillStyle = '#63201d'; ctx.font = 'bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText('▲', w/2, h/2+4);
  }
  ctx.restore();
}
function nextIsBoss(room, d){
  const off = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] }[d];
  const nr = G.floor.grid[G.floor.key(room.gx+off[0], room.gy+off[1])];
  return !!(nr && nr.type === 'boss');
}

function drawDecals(room){
  for (const d of room.decals){
    ctx.save(); ctx.globalAlpha = d.a; ctx.fillStyle = d.c;
    ctx.beginPath();
    for (let i=0;i<9;i++){
      const a = i/9*TAU, rr = d.r * (0.6 + hash(d.seed+i*31)*0.7);
      const x = d.x + Math.cos(a)*rr, y = d.y + Math.sin(a)*rr*0.55;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawTrapdoor(room){
  if (!room.trapdoor) return;
  const t = room.trapdoor;
  const o = Math.min(1, t.t/40);
  ctx.save(); ctx.translate(t.x, t.y);
  ctx.fillStyle = '#0b0807';
  ctx.beginPath(); ctx.ellipse(0,0, 34*o, 20*o, 0,0,TAU); ctx.fill();
  ctx.strokeStyle = '#4a3628'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0,0, 34*o, 20*o, 0,0,TAU); ctx.stroke();
  const g = ctx.createRadialGradient(0,0,2,0,0,34*o);
  g.addColorStop(0,'rgba(180,90,40,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0,0,34*o,20*o,0,0,TAU); ctx.fill();
  ctx.restore();
}

function drawPickups(room){
  for (const pk of room.pickups){
    const bob = Math.sin(pk.t*1.6)*3;
    ctx.save(); ctx.translate(pk.x, pk.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(0, 16-bob, 13, 5, 0,0,TAU); ctx.fill();
    if (pk.kind === 'heart'){
      ctx.fillStyle = '#8c2521';
      heartPath(ctx, 0, 0, 11); ctx.fill();
      ctx.fillStyle = '#c4423a'; heartPath(ctx, -1.5, -1.5, 7.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,210,0.5)';
      ctx.beginPath(); ctx.arc(-3.5,-3.5,1.8,0,TAU); ctx.fill();
    } else if (pk.kind === 'pill'){
      ctx.rotate(-0.5);
      ctx.fillStyle = '#c9c2b4'; roundRect(ctx,-10,-6,20,12,6); ctx.fill();
      ctx.fillStyle = '#6c3f8c'; ctx.beginPath();
      ctx.arc(-4,0,6,Math.PI/2,Math.PI*1.5); ctx.rect(-4,-6,4,12); ctx.fill();
    } else if (pk.kind === 'item'){
      const g = ctx.createRadialGradient(0,-4,2,0,-4,46);
      g.addColorStop(0,'rgba(214,168,96,0.30)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,-4,46,0,TAU); ctx.fill();
      // pedestal
      ctx.fillStyle = '#3a2f26'; roundRect(ctx,-16,4,32,16,3); ctx.fill();
      ctx.fillStyle = '#4a3c30'; roundRect(ctx,-20,0,40,7,3); ctx.fill();
      drawItemIcon(pk.item.id, 0, -14);
    }
    ctx.restore();
  }
}
function heartPath(c,x,y,s){
  c.beginPath();
  c.moveTo(x, y+s*0.75);
  c.bezierCurveTo(x-s*1.4, y-s*0.25, x-s*0.55, y-s*1.15, x, y-s*0.42);
  c.bezierCurveTo(x+s*0.55, y-s*1.15, x+s*1.4, y-s*0.25, x, y+s*0.75);
  c.closePath();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawItemIcon(id, x, y){
  ctx.save(); ctx.translate(x,y);
  if (id==='knuck'){
    ctx.fillStyle='#a9a091'; roundRect(ctx,-13,-6,26,12,3); ctx.fill();
    ctx.fillStyle='#0f0c0a';
    for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-9+i*6,0,3,0,TAU); ctx.fill(); }
  } else if (id==='vial'){
    ctx.fillStyle='#3f5a3a'; roundRect(ctx,-6,-10,12,20,3); ctx.fill();
    ctx.fillStyle='#7fc060'; roundRect(ctx,-4,0,8,8,2); ctx.fill();
    ctx.fillStyle='#8a8375'; ctx.fillRect(-7,-13,14,4);
  } else if (id==='shoes'){
    ctx.fillStyle='#4a3226'; roundRect(ctx,-12,-4,13,10,3); ctx.fill();
    ctx.fillStyle='#3a2620'; roundRect(ctx,1,-6,12,12,3); ctx.fill();
  } else if (id==='tub'){
    ctx.fillStyle='#8f3a30'; roundRect(ctx,-10,-9,20,19,2); ctx.fill();
    ctx.fillStyle='#d8cbb4'; ctx.fillRect(-10,-2,20,5);
  } else if (id==='reach'){
    ctx.strokeStyle='#c98d6b'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-12,6); ctx.lineTo(10,-8); ctx.stroke();
    ctx.fillStyle='#c98d6b'; ctx.beginPath(); ctx.arc(11,-9,5,0,TAU); ctx.fill();
  } else if (id==='split'){
    ctx.fillStyle='#c98d6b';
    ctx.beginPath(); ctx.arc(-7,-3,6,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7,4,6,0,TAU); ctx.fill();
  } else if (id==='lard'){
    ctx.fillStyle='#e2dcc4'; ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
    ctx.fillStyle='#cfc6a6'; ctx.beginPath(); ctx.arc(-3,-3,6,0,TAU); ctx.fill();
  } else if (id==='nails'){
    ctx.strokeStyle='#9aa0a4'; ctx.lineWidth=2.5;
    for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-9+i*6,7); ctx.lineTo(-7+i*6,-8); ctx.stroke(); }
  }
  ctx.restore();
}

/* ── the man ───────────────────────────────────────────────────── */
function drawPlayer(p){
  const bob  = Math.sin(p.step*2)*2.2 + Math.sin(p.breathe)*0.9;
  const lean = Math.sin(p.step)*0.06;
  const flick = p.inv > 0 && Math.floor(G.t/4)%2 === 0;

  ctx.save(); ctx.translate(p.x, p.y);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 24, 22, 8, 0,0,TAU); ctx.fill();

  if (flick) ctx.globalAlpha = 0.45;
  ctx.save(); ctx.rotate(lean);

  const SKIN = '#c08663', SKIN_D = '#9c6647', HAIR = '#211710';
  const TANK = flick ? '#e6e3d8' : '#cdc9bc', TANK_D = '#a9a598';

  // legs
  const ls = Math.sin(p.step*2)*5;
  ctx.fillStyle = '#2b2119';
  roundRect(ctx, -13, 8+ls*0.3, 12, 20-ls*0.2, 4); ctx.fill();
  roundRect(ctx,   2, 8-ls*0.3, 12, 20+ls*0.2, 4); ctx.fill();
  ctx.fillStyle = '#181210';
  roundRect(ctx, -14, 24+ls*0.3, 14, 7, 3); ctx.fill();
  roundRect(ctx,   1, 24-ls*0.3, 14, 7, 3); ctx.fill();

  // arms (behind torso), reaching toward aim
  const aimx = Math.cos(p.aim), aimy = Math.sin(p.aim);
  const punch = p.cool > p.fireDelay - 7 ? (p.cool-(p.fireDelay-7))/7 : 0;
  ctx.strokeStyle = SKIN; ctx.lineWidth = 11; ctx.lineCap = 'round';
  for (const s of [-1, 1]){
    const sx = s*17, sy = bob;
    const ex = sx + aimx*(14 + punch*13) + s*4;
    const ey = sy + aimy*(14 + punch*13) + 8;
    ctx.beginPath(); ctx.moveTo(sx, sy+2); ctx.lineTo(ex, ey); ctx.stroke();
    // fist
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(ex, ey, 7.5, 0, TAU); ctx.fill();
    ctx.fillStyle = SKIN_D;
    ctx.beginPath(); ctx.arc(ex+1.5, ey+2, 4.5, 0, TAU); ctx.fill();
  }
  // arm hair
  ctx.strokeStyle = 'rgba(33,23,16,0.75)'; ctx.lineWidth = 1.2;
  for (let i=0;i<12;i++){
    const s = i<6?-1:1, k = i%6;
    const bx = s*17 + aimx*(4+k*2.2) + s*1, by = bob + aimy*(4+k*2.2) + 3 + k*1.2;
    const a = hash(i*37)*TAU;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(a)*4, by+Math.sin(a)*4); ctx.stroke();
  }

  // torso — tank top
  ctx.fillStyle = TANK;
  roundRect(ctx, -18, -10+bob, 36, 26, 7); ctx.fill();
  // shoulder straps
  ctx.fillStyle = TANK;
  roundRect(ctx, -15, -20+bob, 7, 13, 3); ctx.fill();
  roundRect(ctx,   8, -20+bob, 7, 13, 3); ctx.fill();
  // exposed chest between straps
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.moveTo(-8, -19+bob); ctx.lineTo(8, -19+bob);
  ctx.lineTo(6, -6+bob); ctx.lineTo(0, -1+bob); ctx.lineTo(-6, -6+bob);
  ctx.closePath(); ctx.fill();
  // chest hair
  ctx.strokeStyle = HAIR; ctx.lineWidth = 1.4;
  for (let i=0;i<16;i++){
    const hx = -6 + hash(i*13)*12, hy = -17 + hash(i*29)*14 + bob;
    const a = 1.2 + hash(i*7)*1.4;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(a)*3.4, hy+Math.sin(a)*3.4); ctx.stroke();
  }
  // tank shading + stains
  ctx.fillStyle = TANK_D;
  ctx.fillRect(-18, 10+bob, 36, 6);
  ctx.fillStyle = 'rgba(90,35,30,0.32)';
  ctx.beginPath(); ctx.ellipse(-11, 4+bob, 6, 4, 0.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, 9+bob, 4.5, 3, -0.3, 0, TAU); ctx.fill();
  if (p.hp <= 2){
    ctx.fillStyle = 'rgba(110,25,22,0.5)';
    ctx.beginPath(); ctx.ellipse(2, 2+bob, 12, 9, 0.2, 0, TAU); ctx.fill();
  }

  // neck
  ctx.fillStyle = SKIN_D;
  ctx.fillRect(-6, -24+bob, 12, 8);

  // head
  const hx = aimx*3, hy = bob - 34 + aimy*1.5;
  ctx.save(); ctx.translate(hx, hy);
  // skull
  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 16, 0, 0, TAU); ctx.fill();
  // hair mass on top
  ctx.fillStyle = HAIR;
  ctx.beginPath(); ctx.ellipse(0, -8, 15.5, 10, 0, Math.PI, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -3, 15.5, 13, 0, Math.PI*1.05, Math.PI*1.95); ctx.fill();
  // beard
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(-14, 1); ctx.quadraticCurveTo(-13, 17, 0, 19);
  ctx.quadraticCurveTo(13, 17, 14, 1);
  ctx.quadraticCurveTo(9, 8, 0, 8); ctx.quadraticCurveTo(-9, 8, -14, 1);
  ctx.closePath(); ctx.fill();
  // brow
  ctx.fillStyle = HAIR;
  ctx.save();
  ctx.translate(0, -3 + aimy*1.2);
  ctx.rotate(-0.06);
  ctx.fillRect(-12, -2, 10, 4.5);
  ctx.restore();
  ctx.save();
  ctx.translate(0, -3 + aimy*1.2);
  ctx.rotate(0.06);
  ctx.fillRect(2, -2, 10, 4.5);
  ctx.restore();
  // eyes — small, sunken, tracking aim
  const ex = aimx*2.2, ey = aimy*1.6;
  ctx.fillStyle = '#efe9dc';
  ctx.beginPath(); ctx.ellipse(-6+ex*0.4, 3+ey*0.4, 3.6, 3, 0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 6+ex*0.4, 3+ey*0.4, 3.6, 3, 0,0,TAU); ctx.fill();
  ctx.fillStyle = '#120d0a';
  ctx.beginPath(); ctx.arc(-6+ex, 3+ey, 1.9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 6+ex, 3+ey, 1.9, 0, TAU); ctx.fill();
  // mouth in beard — set, grim
  ctx.strokeStyle = '#160f0c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-4, 11); ctx.lineTo(4, 11); ctx.stroke();
  // sweat when low
  if (p.hp <= 2 && Math.floor(G.t/20)%3 === 0){
    ctx.fillStyle = 'rgba(180,210,220,0.6)';
    ctx.beginPath(); ctx.ellipse(13, -2, 2, 3.4, 0,0,TAU); ctx.fill();
  }
  ctx.restore();
  ctx.restore(); // lean

  // damage flash
  if (p.hurtFlash > 0){
    ctx.globalAlpha = (p.hurtFlash/22) * 0.55;
    ctx.fillStyle = '#8d2320';
    ctx.beginPath(); ctx.arc(0, -8, 34, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // stomp ready glow
  if (p.stompCd <= 0){
    ctx.globalAlpha = 0.14 + Math.sin(G.t*0.08)*0.05;
    ctx.strokeStyle = '#c98a4a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 26, 26, 9, 0,0,TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ── enemies ───────────────────────────────────────────────────── */
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, e.r*0.75, e.r*0.9, e.r*0.32, 0,0,TAU); ctx.fill();

  const hurt = e.flash > 0;
  if (e.type==='ginger') drawGinger(e, hurt);
  if (e.type==='teddy')  drawTeddy(e, hurt);
  if (e.type==='rattle') drawRattle(e, hurt);
  if (e.type==='windup') drawWindup(e, hurt);

  // health pip for tanky ones
  if (e.maxHp > 12 && e.hp < e.maxHp){
    const w = e.r*1.7;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(-w/2, -e.r-14, w, 4);
    ctx.fillStyle = '#8f3029'; ctx.fillRect(-w/2, -e.r-14, w*(e.hp/e.maxHp), 4);
  }
  ctx.restore();
}

function drawGinger(e, hurt){
  const run = e.state === 'run';
  const sw = run ? Math.sin(e.t*0.35)*0.5 : Math.sin(e.t*0.06)*0.08;
  ctx.save();
  ctx.rotate(Math.sin(e.t*0.3)*(run?0.13:0.03));
  const body = hurt ? '#ffe7c8' : '#8f5e33';
  const dark = hurt ? '#ffe7c8' : '#6d4522';

  // legs
  ctx.strokeStyle = body; ctx.lineWidth = 6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-8+sw*8, 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 4, 6); ctx.lineTo( 8-sw*8, 15); ctx.stroke();
  // arms
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-5,-3); ctx.lineTo(-13, -9-sw*6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 5,-3); ctx.lineTo( 13, -9+sw*6); ctx.stroke();
  // torso
  ctx.fillStyle = body; roundRect(ctx,-7,-6,14,14,4); ctx.fill();
  // head
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0,-12,9,0,TAU); ctx.fill();
  // baked-edge shading
  ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0,-12,9,0,TAU); ctx.stroke();
  // crack through the torso
  ctx.strokeStyle = '#3d2411'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-3,-5); ctx.lineTo(1,0); ctx.lineTo(-2,4); ctx.lineTo(2,8); ctx.stroke();
  // icing — a smile far too wide
  ctx.strokeStyle = hurt ? '#fff' : '#e6ded0'; ctx.lineWidth = 2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,-12, 6, 0.25, Math.PI-0.25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-9,-2); ctx.lineTo(9,-2); ctx.stroke();
  // eyes — dead currants
  ctx.fillStyle = '#100b07';
  ctx.beginPath(); ctx.arc(-3.4,-14.5,1.9,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 3.4,-14.5,1.9,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.arc(-4,-15.2,0.6,0,TAU); ctx.fill();
  // gumdrop buttons
  ctx.fillStyle = '#7a2b2b';
  ctx.beginPath(); ctx.arc(0,-2.5,1.8,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0,3,1.8,0,TAU); ctx.fill();
  ctx.restore();
}

function drawTeddy(e, hurt){
  const wind = e.state === 'wind', chg = e.state === 'charge';
  const sq = wind ? 1 + Math.sin(e.t*0.6)*0.09 : 1;
  ctx.save();
  ctx.scale(e.face, 1);
  ctx.translate(0, Math.sin(e.t*0.12)*1.5);
  ctx.scale(sq, 2-sq);
  const fur  = hurt ? '#fff0da' : '#6b4a30';
  const furD = hurt ? '#fff0da' : '#4e3421';
  const muzz = hurt ? '#fff' : '#a58a68';

  if (wind){ // telegraph
    ctx.strokeStyle = 'rgba(190,70,55,' + (0.25+Math.sin(e.t*0.5)*0.2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(e.dir)*80*e.face, Math.sin(e.dir)*80); ctx.stroke();
  }
  // ears
  ctx.fillStyle = furD;
  ctx.beginPath(); ctx.arc(-14,-19,8,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 14,-19,8,0,TAU); ctx.fill();
  ctx.fillStyle = '#7d5a3d';
  ctx.beginPath(); ctx.arc(-14,-19,4,0,TAU); ctx.fill();
  // legs
  ctx.fillStyle = furD;
  ctx.beginPath(); ctx.ellipse(-11, 17, 8, 6, 0.2,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 11, 17, 8, 6, -0.2,0,TAU); ctx.fill();
  // arms
  const asw = chg ? -0.9 : Math.sin(e.t*0.1)*0.2;
  ctx.fillStyle = furD;
  ctx.save(); ctx.translate(-17,-2); ctx.rotate(asw); ctx.beginPath(); ctx.ellipse(0,6,6.5,10,0,0,TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate( 17,-2); ctx.rotate(-asw); ctx.beginPath(); ctx.ellipse(0,6,6.5,10,0,0,TAU); ctx.fill(); ctx.restore();
  // body
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, 3, 17, 18, 0,0,TAU); ctx.fill();
  // belly patch
  ctx.fillStyle = muzz;
  ctx.beginPath(); ctx.ellipse(0, 6, 10, 11, 0,0,TAU); ctx.fill();
  // torn seam with stuffing pushing out
  ctx.strokeStyle = '#2b1c12'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-4, 10); ctx.stroke();
  ctx.fillStyle = hurt ? '#fff' : '#ddd0b6';
  ctx.beginPath(); ctx.arc(-7, 2, 4.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-4, 6, 3, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#231710'; ctx.lineWidth = 1;
  for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-11, -3+i*4); ctx.lineTo(-5, -5+i*4); ctx.stroke(); }
  // head
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, -16, 15, 14, 0,0,TAU); ctx.fill();
  ctx.fillStyle = muzz;
  ctx.beginPath(); ctx.ellipse(0, -11, 8, 6.5, 0,0,TAU); ctx.fill();
  // nose + stitched mouth
  ctx.fillStyle = '#1a1009';
  ctx.beginPath(); ctx.ellipse(0,-13.5,3,2.2,0,0,TAU); ctx.fill();
  ctx.strokeStyle = '#1a1009'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,-9);
  ctx.moveTo(0,-9); ctx.lineTo(-4,-7); ctx.moveTo(0,-9); ctx.lineTo(4,-7); ctx.stroke();
  // eyes: one button, one missing
  ctx.fillStyle = '#0d0906';
  ctx.beginPath(); ctx.arc(-6,-20,3.4,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(-7,-21,1.1,0,TAU); ctx.fill();
  // empty socket, dangling thread
  ctx.fillStyle = '#241610';
  ctx.beginPath(); ctx.arc(6,-20,3.2,0,TAU); ctx.fill();
  ctx.strokeStyle = '#1d130d'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(6,-17); ctx.quadraticCurveTo(8,-11,5,-6); ctx.stroke();
  ctx.fillStyle = '#0d0906';
  ctx.beginPath(); ctx.arc(5,-5.5,2.4,0,TAU); ctx.fill();
  ctx.restore();
}

function drawRattle(e, hurt){
  const firing = e.state === 'fire';
  ctx.save();
  ctx.rotate(e.wob);
  const col = hurt ? '#ffffff' : '#b8a68c';
  // handle
  ctx.fillStyle = hurt ? '#fff' : '#8e7b62';
  roundRect(ctx, -5, 2, 10, 22, 5); ctx.fill();
  ctx.fillStyle = hurt ? '#fff' : '#6e5c46';
  roundRect(ctx, -7, 20, 14, 7, 3); ctx.fill();
  // ball head
  const pulse = firing ? 1 + Math.sin(e.t*0.9)*0.12 : 1;
  ctx.save(); ctx.scale(pulse, pulse);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0,-6,17,0,TAU); ctx.fill();
  // seam
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-6,17,0,TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-17,-6); ctx.lineTo(17,-6); ctx.stroke();
  // beads inside, visible through cracked shell
  ctx.fillStyle = '#54463a';
  for (let i=0;i<4;i++){
    const a = e.t*0.05 + i/4*TAU;
    ctx.beginPath(); ctx.arc(Math.cos(a)*7, -6+Math.sin(a)*7, 2.2, 0, TAU); ctx.fill();
  }
  // face — painted on, peeling
  ctx.fillStyle = '#120d09';
  ctx.beginPath(); ctx.ellipse(-6,-9, 2.4, firing?4:3, 0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 6,-9, 2.4, firing?4:3, 0,0,TAU); ctx.fill();
  ctx.strokeStyle = '#120d09'; ctx.lineWidth = 2; ctx.lineCap='round';
  ctx.beginPath();
  if (firing) ctx.arc(0,-1,5,0,Math.PI*2);
  else ctx.arc(0,-3,6,0.35,Math.PI-0.35);
  ctx.stroke();
  // crack
  ctx.strokeStyle = 'rgba(20,14,10,0.7)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(10,-18); ctx.lineTo(13,-11); ctx.lineTo(9,-7); ctx.stroke();
  ctx.restore();
  if (firing){
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#d8c9a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,-6, 22 + Math.sin(e.t*0.4)*4, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawWindup(e, hurt){
  ctx.save();
  ctx.scale(e.face, 1);
  const chomp = Math.abs(Math.sin(e.t*0.45));
  const body = hurt ? '#fff' : '#c9b9a0';
  const gum  = hurt ? '#fff' : '#8c3a38';
  // feet
  ctx.fillStyle = hurt ? '#fff' : '#9a8a72';
  const fsw = Math.sin(e.t*0.4)*4;
  roundRect(ctx, -12+fsw, 11, 11, 7, 3); ctx.fill();
  roundRect(ctx,   2-fsw, 11, 11, 7, 3); ctx.fill();
  // wind-up key on the back
  ctx.save(); ctx.translate(-15,-6); ctx.rotate(e.t*0.18);
  ctx.strokeStyle = hurt?'#fff':'#8e949a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0); ctx.moveTo(0,-7); ctx.lineTo(0,7); ctx.stroke();
  ctx.restore();
  // Jaws hinge at the back so the mouth stays one object. The gape is small —
  // a big one just reads as two loose pieces floating apart.
  const gape = chomp * 4;
  // dark throat between the jaws, so the gap is never see-through
  ctx.fillStyle = '#1b0f0c';
  roundRect(ctx, -12, -6, 24, 12, 3); ctx.fill();
  // lower jaw
  ctx.fillStyle = gum;
  roundRect(ctx, -13, 1+gape, 26, 11, 4); ctx.fill();
  ctx.fillStyle = '#efe9dc';
  for (let i=0;i<5;i++){ roundRect(ctx, -10.5+i*4.6, 0.5+gape, 3.6, 5.5, 1); ctx.fill(); }
  // upper jaw
  ctx.fillStyle = gum;
  roundRect(ctx, -13, -12-gape, 26, 12, 4); ctx.fill();
  ctx.fillStyle = '#efe9dc';
  for (let i=0;i<5;i++){ roundRect(ctx, -10.5+i*4.6, -5.5-gape, 3.6, 5.5, 1); ctx.fill(); }
  // one tooth is missing, one is the wrong colour
  ctx.fillStyle = gum; ctx.fillRect(-2.7, -5.5-gape, 3.6, 5.5);
  ctx.fillStyle = '#8a7a5c'; ctx.fillRect(6.1, 0.5+gape, 3.6, 5.5);
  // eyes on stalks
  ctx.fillStyle = '#efe9dc';
  ctx.beginPath(); ctx.arc(-5,-17,4.4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 5,-17,4.4,0,TAU); ctx.fill();
  ctx.fillStyle = '#120d09';
  const lk = Math.sin(e.t*0.2)*1.4;
  ctx.beginPath(); ctx.arc(-5+lk,-17,2,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 5+lk,-17,2,0,TAU); ctx.fill();
  ctx.restore();
}

/* ── MR. SNUGGLES ──────────────────────────────────────────────── */
function drawBoss(b){
  const hurt = b.flash > 0;
  const dying = b.dead;
  ctx.save(); ctx.translate(b.x, b.y);
  if (dying){
    const k = Math.min(1, b.deathT/60);
    ctx.globalAlpha = 1-k;
    ctx.scale(1 - k*0.25, 1 - k*0.35);
    ctx.translate(0, k*20);
  }
  const wind = b.state === 'charge' && b.timer > 16;
  const s = 1 + (wind ? Math.sin(b.t*0.5)*0.05 : Math.sin(b.t*0.05)*0.02);
  ctx.scale(s, 2-s);

  ctx.globalAlpha *= 1;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(0, 52, 54, 17, 0,0,TAU); ctx.fill();

  const fur  = hurt ? '#fff0da' : '#5d3f28';
  const furD = hurt ? '#fff0da' : '#422c1b';
  const muzz = hurt ? '#ffffff' : '#93795a';
  const stuff= hurt ? '#ffffff' : '#ddd0b4';

  if (wind){
    ctx.strokeStyle = 'rgba(200,60,45,' + (0.2 + Math.sin(b.t*0.5)*0.18) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(b.chargeAng)*260, Math.sin(b.chargeAng)*260); ctx.stroke();
  }

  // ears
  ctx.fillStyle = furD;
  ctx.beginPath(); ctx.arc(-33,-52,17,0,TAU); ctx.fill();
  if (!b.headTorn){ ctx.beginPath(); ctx.arc(33,-52,17,0,TAU); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.arc(33,-52,17,Math.PI*0.2,Math.PI*1.5); ctx.fill();
    ctx.fillStyle = stuff; ctx.beginPath(); ctx.arc(38,-48,7,0,TAU); ctx.fill();
    ctx.fillStyle = furD;
  }
  ctx.fillStyle = '#7a5a3c';
  ctx.beginPath(); ctx.arc(-33,-52,8.5,0,TAU); ctx.fill();

  // legs
  ctx.fillStyle = furD;
  ctx.beginPath(); ctx.ellipse(-27, 42, 20, 15, 0.15,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 27, 42, 20, 15, -0.15,0,TAU); ctx.fill();
  ctx.fillStyle = muzz;
  ctx.beginPath(); ctx.ellipse(-29, 45, 11, 8, 0.15,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 29, 45, 11, 8, -0.15,0,TAU); ctx.fill();

  // arms
  const asw = wind ? -1.1 : Math.sin(b.t*0.06)*0.18;
  ctx.fillStyle = furD;
  ctx.save(); ctx.translate(-42,-6); ctx.rotate(asw);
  ctx.beginPath(); ctx.ellipse(0,14,15,25,0,0,TAU); ctx.fill(); ctx.restore();
  if (!b.armOff){
    ctx.save(); ctx.translate(42,-6); ctx.rotate(-asw);
    ctx.beginPath(); ctx.ellipse(0,14,15,25,0,0,TAU); ctx.fill(); ctx.restore();
  } else {
    // torn shoulder gushing stuffing
    ctx.fillStyle = stuff;
    ctx.beginPath(); ctx.arc(40, 2, 13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(48, 12, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6b2b28';
    ctx.beginPath(); ctx.arc(42, 6, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2a1a11'; ctx.lineWidth = 2;
    for (let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(30, -8+i*6); ctx.lineTo(38, -12+i*6); ctx.stroke(); }
  }

  // body
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, 6, 44, 46, 0,0,TAU); ctx.fill();
  // fur texture
  ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 1.6;
  for (let i=0;i<40;i++){
    const a = hash(i*11)*TAU, rr = 12 + hash(i*23)*32;
    const x = Math.cos(a)*rr, y = 6 + Math.sin(a)*rr;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+2.5, y+4); ctx.stroke();
  }
  // belly
  ctx.fillStyle = muzz;
  ctx.beginPath(); ctx.ellipse(0, 14, 26, 29, 0,0,TAU); ctx.fill();

  // the big seam — opens as phases progress
  const open = b.phase;
  ctx.strokeStyle = '#22150d'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-4, -24); ctx.quadraticCurveTo(6, 4, -2, 34); ctx.stroke();
  if (open >= 2){
    ctx.fillStyle = stuff;
    ctx.beginPath(); ctx.ellipse(0, 6, 13, 22, 0.05, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6b2b28';
    ctx.beginPath(); ctx.ellipse(0, 10, 7, 13, 0.05, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2a1a11'; ctx.lineWidth = 2;
    for (let i=0;i<7;i++){
      ctx.beginPath();
      ctx.moveTo(-16, -18+i*8); ctx.lineTo(-8, -22+i*8);
      ctx.moveTo( 16, -18+i*8); ctx.lineTo( 8, -22+i*8);
      ctx.stroke();
    }
  }
  if (open >= 3){
    // heart-thing beating in the cavity
    const beat = 1 + Math.sin(b.t*0.25)*0.14;
    ctx.save(); ctx.translate(0, 10); ctx.scale(beat, beat);
    ctx.fillStyle = '#8f2b26'; heartPath(ctx, 0, 0, 9); ctx.fill();
    ctx.fillStyle = '#c04b3f'; heartPath(ctx, -1, -1, 5.5); ctx.fill();
    ctx.restore();
  }

  // head
  ctx.save(); ctx.translate(0, -44);
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, 0, 36, 32, 0,0,TAU); ctx.fill();
  if (b.headTorn){
    ctx.fillStyle = stuff;
    ctx.beginPath(); ctx.ellipse(20, -14, 15, 12, 0.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#2a1a11'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6,-26); ctx.lineTo(34,-6); ctx.stroke();
  }
  ctx.fillStyle = muzz;
  ctx.beginPath(); ctx.ellipse(0, 10, 19, 14, 0,0,TAU); ctx.fill();
  // nose
  ctx.fillStyle = '#150d07';
  ctx.beginPath(); ctx.ellipse(0, 4, 7.5, 5.5, 0,0,TAU); ctx.fill();
  // stitched mouth — comes undone in phase 3
  ctx.strokeStyle = '#150d07'; ctx.lineWidth = 3; ctx.lineCap='round';
  if (b.phase < 3){
    ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,13);
    ctx.moveTo(0,13); ctx.lineTo(-10,17); ctx.moveTo(0,13); ctx.lineTo(10,17); ctx.stroke();
  } else {
    ctx.fillStyle = '#180d09';
    ctx.beginPath(); ctx.ellipse(0, 16, 13, 9 + Math.sin(b.t*0.3)*2, 0,0,TAU); ctx.fill();
    ctx.fillStyle = '#e8e0cd';
    for (let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-10+i*5, 8); ctx.lineTo(-7+i*5, 14); ctx.lineTo(-13+i*5, 14); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = '#2a1a11'; ctx.lineWidth = 1.6;
    for (let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-14+i*9, 6); ctx.lineTo(-11+i*9, 2); ctx.stroke(); }
  }
  // eyes — mismatched buttons, one hanging
  ctx.fillStyle = '#0d0906';
  ctx.beginPath(); ctx.arc(-14,-8, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(-16,-10, 2.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0d0906';
  for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-14+(i%2?3:-3), -8+(i<2?-3:3), 1.2, 0, TAU); ctx.fill(); }
  const dangle = b.phase >= 2;
  const dy = dangle ? 12 + Math.sin(b.t*0.09)*4 : 0;
  ctx.strokeStyle = '#1d130d'; ctx.lineWidth = 1.6;
  if (dangle){ ctx.beginPath(); ctx.moveTo(14,-8); ctx.quadraticCurveTo(18,-2,14,-8+dy); ctx.stroke(); }
  ctx.fillStyle = '#241610';
  ctx.beginPath(); ctx.arc(14,-8, 8, 0, TAU); ctx.fill();
  ctx.fillStyle = b.phase>=3 ? '#8f2b26' : '#0d0906';
  ctx.beginPath(); ctx.arc(14, -8+dy, dangle?6:8, 0, TAU); ctx.fill();
  if (b.phase>=3){
    ctx.fillStyle = 'rgba(255,120,90,0.5)';
    ctx.beginPath(); ctx.arc(14,-8+dy, 3, 0, TAU); ctx.fill();
  }
  ctx.restore(); // head

  ctx.restore();
}

/* ── projectiles / particles ───────────────────────────────────── */
function drawBullets(){
  for (const b of G.bullets){
    ctx.save(); ctx.translate(b.x, b.y);
    if (b.friendly){
      // a thrown fist, tumbling
      ctx.rotate(b.spin);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(1.5,2, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c08663';
      ctx.beginPath(); ctx.arc(0,0, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#9c6647';
      for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-b.r*0.45+i*b.r*0.45, -b.r*0.3, b.r*0.24, 0, TAU); ctx.fill(); }
      ctx.strokeStyle = 'rgba(33,23,16,0.6)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-b.r*0.5,b.r*0.4); ctx.lineTo(b.r*0.5,b.r*0.4); ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(0,0,1,0,0,b.r*1.9);
      g.addColorStop(0,'rgba(215,196,158,0.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,b.r*1.9,0,TAU); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(0,0,b.r*0.75,0,TAU); ctx.fill();
      ctx.fillStyle = '#3a2c1c';
      ctx.beginPath(); ctx.arc(-1,-1,b.r*0.3,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawParts(){
  for (const q of G.parts){
    const a = clamp(q.life/q.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot);
    ctx.fillRect(-q.r/2, -q.r/2, q.r, q.r);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  const g = ctx.createRadialGradient(RPX/2, RPY/2, RPY*0.30, RPX/2, RPY/2, RPY*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g; ctx.fillRect(0,0,RPX,RPY);
  // faint flicker
  ctx.globalAlpha = 0.03 + Math.sin(G.t*0.13)*0.012 + Math.sin(G.t*0.41)*0.008;
  ctx.fillStyle = '#c98a4a'; ctx.fillRect(0,0,RPX,RPY);
  ctx.globalAlpha = 1;
}

/* ── HUD ───────────────────────────────────────────────────────── */
function drawHUD(){
  ctx.fillStyle = '#0d0a09'; ctx.fillRect(0,0,W,HUD);
  ctx.fillStyle = '#191311'; ctx.fillRect(0,HUD-3,W,3);

  const p = G.p;
  // hearts
  const full = Math.floor(p.hp/2), half = p.hp%2, total = Math.ceil(p.maxHp/2);
  for (let i=0;i<total;i++){
    const x = 22 + i*26, y = 22;
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle = '#2a1614'; heartPath(ctx,0,0,10); ctx.fill();
    if (i < full){ ctx.fillStyle = '#a52e28'; heartPath(ctx,0,0,10); ctx.fill();
                   ctx.fillStyle = '#cf5348'; heartPath(ctx,-1,-1,6); ctx.fill(); }
    else if (i === full && half){
      ctx.save(); heartPath(ctx,0,0,10); ctx.clip();
      ctx.fillStyle = '#a52e28'; ctx.fillRect(-12,-12,12,24); ctx.restore();
    }
    ctx.restore();
  }

  // stat strip
  ctx.font = '11px monospace'; ctx.textAlign = 'left';
  const stats = [
    ['DMG', p.damage.toFixed(1)],
    ['RATE', (60/p.fireDelay).toFixed(1)],
    ['SPD', p.speed.toFixed(2)],
    ['KILLS', String(G.kills)],
  ];
  stats.forEach((s,i) => {
    const x = 22 + i*92;
    ctx.fillStyle = '#5e5147'; ctx.fillText(s[0], x, 46);
    ctx.fillStyle = '#b9a68c'; ctx.fillText(s[1], x + 38, 46);
  });

  // floor name
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6b5c4e'; ctx.font = 'bold 13px monospace';
  ctx.fillText(FLOORS[G.floorIdx].name, W/2, 20);
  ctx.fillStyle = '#3f362e'; ctx.font = '10px monospace';
  ctx.fillText('DEPTH ' + (G.floorIdx+1) + ' / ' + FLOORS.length, W/2, 36);

  // stomp meter
  const sw = 90, sx = W/2 - sw/2, sy = 44;
  ctx.fillStyle = '#241c17'; ctx.fillRect(sx, sy, sw, 6);
  const rd = 1 - clamp(p.stompCd/170, 0, 1);
  ctx.fillStyle = rd >= 1 ? '#c98a4a' : '#5c4530';
  ctx.fillRect(sx, sy, sw*rd, 6);
  ctx.fillStyle = '#4a3f36'; ctx.font = '9px monospace';
  ctx.fillText('SPACE — STOMP', W/2, 60);

  // boss bar
  const bo = G.room.boss;
  if (bo && !bo.dead){
    const bw = 420, bx = W/2 - bw/2, by = HUD + 8;
    ctx.fillStyle = 'rgba(8,6,5,0.85)'; ctx.fillRect(bx-3, by-3, bw+6, 20);
    ctx.fillStyle = '#2a1614'; ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = '#7e2620'; ctx.fillRect(bx, by, bw*(bo.hp/bo.maxHp), 14);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(bx, by, bw*(bo.hp/bo.maxHp), 5);
    ctx.strokeStyle = '#4a2a22'; ctx.lineWidth = 1; ctx.strokeRect(bx+0.5, by+0.5, bw-1, 13);
    ctx.fillStyle = '#a08a74'; ctx.font = 'bold 10px monospace'; ctx.textAlign='center';
    ctx.fillText('MR. SNUGGLES', W/2, by+26);
  }

  drawMinimap();

  // held items
  ctx.textAlign = 'left';
  const its = G.p.items.slice(-6);
  its.forEach((it,i) => {
    ctx.save(); ctx.translate(W - 250 + i*26, 46); ctx.scale(0.62,0.62);
    drawItemIcon(it.id, 0, 0); ctx.restore();
  });
}

function drawMinimap(){
  const cell = 11, gap = 2;
  const rooms = G.floor.list;
  let minx=99, miny=99, maxx=-99, maxy=-99;
  for (const r of rooms){ if (!r.visited && !anyNeighborVisited(r)) continue;
    minx=Math.min(minx,r.gx); maxx=Math.max(maxx,r.gx);
    miny=Math.min(miny,r.gy); maxy=Math.max(maxy,r.gy); }
  if (minx>maxx) return;
  const mw = (maxx-minx+1)*(cell+gap), mh = (maxy-miny+1)*(cell+gap);
  const ox = W - 22 - mw, oy = 10;
  ctx.fillStyle = 'rgba(8,6,5,0.6)';
  ctx.fillRect(ox-6, oy-5, mw+12, mh+10);
  for (const r of rooms){
    const known = r.visited || anyNeighborVisited(r);
    if (!known) continue;
    const x = ox + (r.gx-minx)*(cell+gap), y = oy + (r.gy-miny)*(cell+gap);
    if (r === G.room){ ctx.fillStyle = '#d2b183'; }
    else if (!r.visited){ ctx.fillStyle = '#302722'; }
    else if (r.type==='boss'){ ctx.fillStyle = '#6b2320'; }
    else if (r.type==='treasure'){ ctx.fillStyle = '#7a6134'; }
    else ctx.fillStyle = '#4d4239';
    ctx.fillRect(x, y, cell, cell);
    if (r.type==='boss' && r.visited){ ctx.fillStyle='#c0554c'; ctx.fillRect(x+4,y+4,3,3); }
    if (r.type==='treasure' && r.visited){ ctx.fillStyle='#d8b45c'; ctx.fillRect(x+4,y+4,3,3); }
  }
}
function anyNeighborVisited(r){
  const d = [[0,-1],[0,1],[-1,0],[1,0]];
  for (const o of d){
    const n = G.floor.grid[G.floor.key(r.gx+o[0], r.gy+o[1])];
    if (n && n.visited) return true;
  }
  return false;
}

/* ── overlays ──────────────────────────────────────────────────── */
function drawOverlays(){
  if (G.msgT > 0 && G.msg){
    const a = Math.min(1, G.msgT/30);
    ctx.globalAlpha = a;
    ctx.textAlign='center';
    ctx.fillStyle = 'rgba(8,6,5,0.75)';
    ctx.fillRect(0, H/2 - 34, W, 52);
    ctx.fillStyle = '#c8b294'; ctx.font = 'bold 22px monospace';
    ctx.fillText(G.msg, W/2, H/2);
    ctx.globalAlpha = 1;
  }

  if (G.paused){
    ctx.fillStyle = 'rgba(6,5,4,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#c8b294'; ctx.font='bold 28px monospace';
    ctx.fillText('PAUSED', W/2, H/2 - 10);
    ctx.fillStyle='#6b5c4e'; ctx.font='12px monospace';
    ctx.fillText('P / ESC to resume    ·    M to ' + (muted?'unmute':'mute'), W/2, H/2 + 20);
  }

  if (G.state === 'dead'){
    const a = Math.min(0.88, G.deathT/70);
    ctx.fillStyle = 'rgba(10,4,4,' + a + ')'; ctx.fillRect(0,0,W,H);
    if (G.deathT > 40){
      ctx.textAlign='center';
      ctx.fillStyle = '#8f2b26'; ctx.font = 'bold 44px monospace';
      ctx.fillText('STUFFED', W/2, H/2 - 24);
      ctx.fillStyle = '#7a6a5c'; ctx.font = '13px monospace';
      ctx.fillText('they got you in ' + FLOORS[G.floorIdx].name.toLowerCase(), W/2, H/2 + 8);
      ctx.fillText(G.kills + ' toys torn open  ·  ' + Math.floor(G.runT/60) + 's', W/2, H/2 + 30);
      ctx.fillStyle = '#c8b294'; ctx.font = 'bold 14px monospace';
      if (Math.floor(G.t/30)%2) ctx.fillText('press R', W/2, H/2 + 68);
    }
  }

  if (G.state === 'win'){
    ctx.fillStyle = 'rgba(6,5,4,' + Math.min(0.9, G.winT/60) + ')'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle = '#c8b294'; ctx.font = 'bold 40px monospace';
    ctx.fillText('THE TOY BOX IS EMPTY', W/2, H/2 - 30);
    ctx.fillStyle = '#7a6a5c'; ctx.font = '13px monospace';
    ctx.fillText('nothing is moving. you sit down.', W/2, H/2 + 6);
    ctx.fillText(G.kills + ' toys torn open  ·  ' + Math.floor(G.runT/60) + 's  ·  ' + G.p.items.length + ' things taken', W/2, H/2 + 30);
    ctx.fillStyle = '#c8b294'; ctx.font = 'bold 14px monospace';
    if (Math.floor(G.t/30)%2) ctx.fillText('press R to go back down', W/2, H/2 + 70);
  }
}

/* ── title ─────────────────────────────────────────────────────── */
function drawTitle(){
  ctx.fillStyle = '#0a0807'; ctx.fillRect(0,0,W,H);
  // slow drifting stuffing motes
  for (let i=0;i<40;i++){
    const t = G.titleT*0.3 + i*97;
    const x = (hash(i*7)*W + t*0.25) % W;
    const y = (hash(i*13)*H + t*0.12) % H;
    ctx.globalAlpha = 0.05 + hash(i*3)*0.08;
    ctx.fillStyle = '#ddd0b4';
    ctx.fillRect(x, y, 2+hash(i*5)*3, 2+hash(i*5)*3);
  }
  ctx.globalAlpha = 1;

  ctx.save(); ctx.translate(W/2, H/2 + 40); ctx.scale(1.5,1.5);
  const fake = { x:0,y:0, step:G.titleT*0.05, breathe:G.titleT*0.03, aim:-Math.PI/2,
                 cool:0, fireDelay:17, inv:0, hp:6, maxHp:6, hurtFlash:0, stompCd:99 };
  ctx.save(); ctx.translate(0,0);
  drawPlayerAt(fake);
  ctx.restore();
  ctx.restore();

  const g = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 460);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.8)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.fillStyle = '#0a0807'; ctx.font = 'bold 82px monospace';
  ctx.fillText('STUFFED', W/2+4, 156);
  ctx.fillStyle = '#c8b294'; ctx.fillText('STUFFED', W/2, 152);
  ctx.fillStyle = '#6b3330'; ctx.font = '13px monospace';
  ctx.fillText('they were always going to come apart', W/2, 182);

  ctx.fillStyle = '#5e5147'; ctx.font = '12px monospace';
  const lines = [
    'WASD  move          ARROWS / MOUSE  throw fists',
    'SPACE  stomp        P  pause        M  mute',
  ];
  lines.forEach((l,i) => ctx.fillText(l, W/2, H - 96 + i*20));
  ctx.fillStyle = '#c8b294'; ctx.font = 'bold 15px monospace';
  if (Math.floor(G.titleT/30)%2) ctx.fillText('press any key', W/2, H - 40);
}
function drawPlayerAt(p){
  const saveP = G.p; G.p = p;
  drawPlayer(p);
  G.p = saveP;
}

/* ── loop ──────────────────────────────────────────────────────── */
let last = 0, acc = 0;
const STEP = 1000/60;
function frame(ts){
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 250) dt = 250;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
